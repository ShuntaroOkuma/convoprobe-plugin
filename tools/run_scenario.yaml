identity:
  author: soitto
  name: run_scenario
  label:
    en_US: Run Scenario
    ja_JP: シナリオを実行

description:
  human:
    en_US: Run a saved ConvoProbe scenario against a Dify chatbot in this workspace.
    ja_JP: ConvoProbe に保存済みのシナリオを、このワークスペース内の Dify チャットボットに対して実行します。
  llm: Run a multi-turn QA test scenario against a Dify chatbot. Takes a scenario_id and a target_app, returns run_id, status, score and a transcript URL.

extra:
  python:
    source: tools/run_scenario.py

parameters:
  # NOTE: scenario_id was originally `type: dynamic-select` with a
  # _fetch_parameter_options hook in tools/run_scenario.py. Dify Cloud
  # has a known regression where Tool plugin dynamic-select dropdowns
  # do not fire (Issue langgenius/dify#22147, reported 2025-07-12 against
  # 1.6.0, still unfixed in 2026-05). Falling back to a plain text input
  # so the Tool is usable today. The helper backend client still has
  # list_scenarios() so we can flip back to dynamic-select with a 1-line
  # YAML change once Dify ships the fix.
  - name: scenario_id
    type: string
    form: form
    required: true
    label:
      en_US: Scenario ID
      ja_JP: シナリオ ID
    human_description:
      en_US: Paste the scenario UUID from ConvoProbe Web UI (open the scenario detail page; the UUID is in the URL).
      ja_JP: ConvoProbe Web UI でシナリオ詳細ページを開き、URL の UUID をコピーして貼り付けてください。
    llm_description: ConvoProbe scenario identifier (UUID, e.g. e9223786-230c-430c-a154-ddc40f610851).
  - name: target_app
    type: app-selector
    scope: chat
    form: form
    required: true
    label:
      en_US: Target Chatbot
      ja_JP: テスト対象チャットボット
    human_description:
      en_US: Select the chatbot in this workspace to test.
      ja_JP: このワークスペース内のテスト対象チャットボットを選択してください。
    llm_description: Target Dify chat app to evaluate.
  - name: wait_for_completion
    type: boolean
    form: form
    required: false
    default: true
    label:
      en_US: Wait for completion
      ja_JP: 完了を待つ
    human_description:
      en_US: When enabled, the node blocks until the run finishes and returns the final score. When disabled, the node returns immediately with run_id only.
      ja_JP: 有効にすると Run が完了するまでノードがブロックし、最終スコアを返します。無効にすると即座に run_id のみを返します。
    llm_description: Whether to wait for the run to complete (default true).
