settings:
  - name: convoprobe_api_token
    type: secret-input
    required: true
    label:
      en_US: ConvoProbe API Token
      ja_JP: ConvoProbe APIトークン
    placeholder:
      en_US: cp_xxxxxxxx...
      ja_JP: cp_xxxxxxxx...
    help:
      en_US: Issue a token from ConvoProbe Web UI -> Settings -> Plugin
      ja_JP: ConvoProbe Web UI の 設定 → Plugin から発行してください
  - name: target_app
    type: app-selector
    scope: chat
    required: true
    label:
      en_US: Target Chatbot
      ja_JP: テスト対象チャットボット
    help:
      en_US: Select the chatbot in this workspace to test
      ja_JP: このワークスペース内のテスト対象チャットボットを選択してください
  # judge_llm_api_key removed 2026-05-04 — Option C (Reverse Invocation
  # session.model.llm.invoke) confirmed in production. Judge LLM uses the user's
  # Dify Workspace provider directly; no extra setting needed. See architecture
  # ADR-007 and research/dify-plugin-day2-findings.md.
  - name: convoprobe_api_base_url
    type: text-input
    required: false
    default: https://convoprobe-production.up.railway.app
    label:
      en_US: ConvoProbe API Base URL (advanced)
      ja_JP: ConvoProbe API ベースURL（詳細）
    placeholder:
      en_US: https://convoprobe-production.up.railway.app
      ja_JP: https://convoprobe-production.up.railway.app
    help:
      en_US: Defaults to ConvoProbe SaaS. Set only for self-hosted deployments.
      ja_JP: 通常は ConvoProbe SaaS が利用されます。セルフホスト時のみ設定してください。
endpoints:
  - endpoints/run.yaml
  - endpoints/health.yaml
  - endpoints/verify.yaml
